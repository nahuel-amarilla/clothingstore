<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS ADMIN | Secure Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>body { display: none; }</style>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black italic uppercase tracking-tighter">NCS ADMIN PANEL</h1>
            <a href="index.html" class="text-[10px] font-bold bg-black text-white px-4 py-2 rounded-full uppercase">Back to Store</a>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-xl border border-gray-200">
            <h2 class="text-xl font-black mb-6 uppercase tracking-tight text-center">Add New Drop Item</h2>
            
            <form id="upload-form" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1 text-gray-400">Product Name</label>
                    <input type="text" id="name" placeholder="E.g. NCS TECH OVERSIZE" class="w-full p-4 border rounded-2xl bg-gray-50 font-bold focus:ring-2 focus:ring-black outline-none" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-1 text-gray-400">Sale Price ($)</label>
                        <input type="number" id="price" placeholder="50" class="w-full p-4 border rounded-2xl bg-gray-50 font-bold outline-none" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-1 text-red-500">Old Price (Optional)</label>
                        <input type="number" id="old_price" placeholder="85" class="w-full p-4 border rounded-2xl bg-gray-50 font-bold outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1 text-gray-400">Category</label>
                    <select id="category" class="w-full p-4 border rounded-2xl bg-gray-50 font-bold outline-none">
                        <option value="T-Shirts">T-SHIRTS</option>
                        <option value="Pants">PANTS</option>
                        <option value="Jackets">JACKETS</option>
                        <option value="Accessories">ACCESSORIES</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1 text-gray-400">Product Image (Desktop File)</label>
                    <input type="file" id="image-file" accept="image/*" class="w-full p-4 border rounded-2xl bg-gray-50 font-medium outline-none" required>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-black text-white p-5 rounded-2xl font-black uppercase tracking-widest hover:bg-gray-900 active:scale-95 transition shadow-lg">
                    Confirm & Upload
                </button>
            </form>
            
            <p id="status" class="mt-4 text-center font-bold uppercase text-[10px] tracking-widest"></p>
        </div>
    </div>

    <script>
        // SEGURIDAD
        const CLAVE_MAESTRA = "NCS2026"; 
        const pass = prompt("Enter Admin Password:");
        if (pass === CLAVE_MAESTRA) { document.body.style.display = "block"; } 
        else { alert("Access Denied"); window.location.href = "index.html"; }

        // CONFIGURACIÓN SUPABASE
        const _supabase = supabase.createClient('https://daoctgxvndqkjkethjcc.supabase.co', 'sb_publishable_G-9m4zalYE3mRzDpw2OiCQ_qFMxk9ec');

        const form = document.getElementById('upload-form');
        const status = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            status.innerText = "UPLOADING FILE...";
            status.className = "mt-4 text-center font-bold text-blue-500 animate-pulse";

            const file = document.getElementById('image-file').files[0];
            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const old_price = document.getElementById('old_price').value ? parseFloat(document.getElementById('old_price').value) : null;
            const category = document.getElementById('category').value;

            // 1. SUBIR IMAGEN AL STORAGE
            const fileName = `${Date.now()}-${file.name}`;
            const { data: storageData, error: storageError } = await _supabase
                .storage
                .from('product-images')
                .upload(fileName, file);

            if (storageError) {
                status.innerText = "STORAGE ERROR: " + storageError.message;
                status.className = "text-red-500";
                btn.disabled = false;
                return;
            }

            // 2. OBTENER URL PÚBLICA DE LA IMAGEN
            const { data: urlData } = _supabase.storage.from('product-images').getPublicUrl(fileName);
            const image_url = urlData.publicUrl;

            // 3. GUARDAR EN LA TABLA
            status.innerText = "SAVING PRODUCT...";
            const { error: dbError } = await _supabase
                .from('products')
                .insert([{ name, price, old_price, category, image_url }]);

            if (dbError) {
                status.innerText = "DATABASE ERROR: " + dbError.message;
                status.className = "text-red-500";
            } else {
                status.innerText = "DONE! DROP UPDATED.";
                status.className = "text-green-500";
                form.reset();
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
