<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS ADMIN | Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div class="max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-black italic">NCS ADMIN PANEL</h1>
            <a href="index.html" class="text-xs font-bold bg-black text-white px-4 py-2 rounded-full uppercase">Go to Store</a>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-xl">
            <h2 class="text-xl font-bold mb-6 uppercase tracking-tight">Upload New Product</h2>
            
            <form id="upload-form" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1">Product Name</label>
                    <input type="text" id="name" placeholder="E.g. Vintage Oversized Tee" class="w-full p-4 border rounded-xl bg-gray-50 focus:ring-2 focus:ring-black outline-none" required>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-1">Sale Price ($)</label>
                        <input type="number" id="price" placeholder="25" class="w-full p-4 border rounded-xl bg-gray-50 outline-none" required>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase mb-1 text-red-500">Old Price (For Sale/Rebaja)</label>
                        <input type="number" id="old_price" placeholder="40" class="w-full p-4 border rounded-xl bg-gray-50 outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1">Category</label>
                    <select id="category" class="w-full p-4 border rounded-xl bg-gray-50 outline-none">
                        <option value="T-Shirts">T-Shirts</option>
                        <option value="Pants">Pants</option>
                        <option value="Jackets">Jackets</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase mb-1">Image URL</label>
                    <input type="url" id="image_url" placeholder="https://..." class="w-full p-4 border rounded-xl bg-gray-50 outline-none" required>
                </div>

                <button type="submit" class="w-full bg-black text-white p-5 rounded-2xl font-black uppercase tracking-widest hover:bg-gray-800 transition shadow-lg">
                    Upload to Collection
                </button>
            </form>
            
            <p id="status" class="mt-4 text-center font-bold uppercase text-xs"></p>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const _supabase = supabase.createClient('https://daoctgxvndqkjkethjcc.supabase.co', 'sb_publishable_G-9m4zalYE3mRzDpw2OiCQ_qFMxk9ec');

        const form = document.getElementById('upload-form');
        const status = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            status.innerText = "Processing...";
            status.className = "mt-4 text-center font-bold text-gray-400";

            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const old_price = document.getElementById('old_price').value ? parseFloat(document.getElementById('old_price').value) : null;
            const category = document.getElementById('category').value;
            const image_url = document.getElementById('image_url').value;

            const { data, error } = await _supabase
                .from('products')
                .insert([
                    { name, price, old_price, category, image_url }
                ]);

            if (error) {
                status.innerText = "Error: " + error.message;
                status.className = "mt-4 text-center font-bold text-red-500";
            } else {
                status.innerText = "Successfully uploaded to NCS Store!";
                status.className = "mt-4 text-center font-bold text-green-500";
                form.reset();
            }
        });
    </script>
</body>
</html>
