<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS CLOTHING | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .sidebar { transition: transform 0.3s ease-in-out; z-index: 100; }
        .sidebar-open { transform: translateX(0) !important; }
    </style>
</head>
<body class="bg-white text-black">

    <nav class="p-6 flex justify-between items-center border-b sticky top-0 bg-white/90 backdrop-blur-md z-[60]">
        <button id="open-menu" class="text-2xl font-bold">☰</button>
        
        <h1 class="text-2xl font-black tracking-tighter italic absolute left-1/2 -translate-x-1/2">NCS CLOTHING</h1>
        
        <div id="open-cart" class="cursor-pointer bg-black text-white px-5 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest">
            Cart (<span id="cart-count">0</span>)
        </div>
    </nav>

    <div id="menu-sidebar" class="fixed top-0 left-0 h-full w-72 bg-white shadow-2xl -translate-x-full sidebar p-8 flex flex-col border-r">
        <div class="flex justify-between items-center mb-12">
            <h2 class="text-xl font-black italic">MENU</h2>
            <button id="close-menu" class="text-xl">✕</button>
        </div>
        <nav class="space-y-6">
            <button onclick="filterProducts('all')" class="block text-2xl font-bold hover:italic">ALL COLLECTION</button>
            <button onclick="filterProducts('T-Shirts')" class="block text-2xl font-bold hover:italic text-gray-400 hover:text-black">T-SHIRTS</button>
            <button onclick="filterProducts('Pants')" class="block text-2xl font-bold hover:italic text-gray-400 hover:text-black">PANTS</button>
            <button onclick="filterProducts('Jackets')" class="block text-2xl font-bold hover:italic text-gray-400 hover:text-black">JACKETS</button>
        </nav>
        <div class="mt-auto text-[10px] text-gray-400 uppercase tracking-widest">
            NCS Safety & Streetwear © 2026
        </div>
    </div>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-96 bg-white shadow-2xl translate-x-full sidebar p-8 flex flex-col border-l">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black italic uppercase">Your Cart</h2>
            <button id="close-cart" class="text-xl">✕</button>
        </div>
        <div id="cart-items" class="flex-grow overflow-y-auto space-y-4"></div>
        <div class="border-t pt-6">
            <div class="flex justify-between text-xl font-black mb-6">
                <span>TOTAL</span>
                <span id="cart-total">$0</span>
            </div>
            <div id="paypal-button-container"></div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto p-6 mt-10 mb-20">
        <div id="shop-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-12"></div>
    </main>

    <script>
        const _supabase = supabase.createClient('https://daoctgxvndqkjkethjcc.supabase.co', 'sb_publishable_G-9m4zalYE3mRzDpw2OiCQ_qFMxk9ec');
        let allProducts = [];
        let cart = [];

        async function loadStore() {
            const { data, error } = await _supabase.from('products').select('*').order('created_at', { ascending: false });
            if (error) return;
            allProducts = data;
            renderProducts(allProducts);
        }

        function renderProducts(products) {
            const container = document.getElementById('shop-container');
            container.innerHTML = products.map(p => `
                <div class="group">
                    <div class="aspect-[3/4] bg-gray-50 rounded-2xl overflow-hidden mb-4 relative">
                        <img src="${p.image_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
                        <button onclick="addToCart('${p.id}', '${p.name}', ${p.price})" class="absolute bottom-4 left-4 right-4 bg-black text-white py-4 rounded-xl font-bold text-[10px] uppercase opacity-0 group-hover:opacity-100 translate-y-2 group-hover:translate-y-0 transition-all">
                            Add to Cart +
                        </button>
                    </div>
                    <p class="text-[9px] text-gray-400 uppercase tracking-[0.2em] mb-1">${p.category || 'Drop'}</p>
                    <h3 class="font-bold text-sm uppercase">${p.name}</h3>
                    <p class="font-bold text-gray-900 mt-1">$${p.price}</p>
                </div>
            `).join('');
        }

        function filterProducts(category) {
            document.getElementById('menu-sidebar').classList.remove('sidebar-open');
            if (category === 'all') {
                renderProducts(allProducts);
            } else {
                const filtered = allProducts.filter(p => p.category === category);
                renderProducts(filtered);
            }
        }

        function addToCart(id, name, price) {
            cart.push({ id, name, price, cartId: Date.now() });
            updateCartUI();
            document.getElementById('cart-sidebar').classList.add('sidebar-open');
        }

        function removeFromCart(cartId) {
            cart = cart.filter(item => item.cartId !== cartId);
            updateCartUI();
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            document.getElementById('cart-count').innerText = cart.length;
            const total = cart.reduce((acc, item) => acc + item.price, 0);
            document.getElementById('cart-total').innerText = `$${total}`;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-gray-400 text-center mt-10 uppercase text-[10px] tracking-widest">Cart is empty</p>`;
                document.getElementById('paypal-button-container').innerHTML = "";
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="flex justify-between items-center border-b pb-4">
                    <div>
                        <p class="font-black text-xs uppercase">${item.name}</p>
                        <p class="text-gray-500 text-[10px]">$${item.price}</p>
                    </div>
                    <button onclick="removeFromCart(${item.cartId})" class="text-red-500 text-[10px] font-black uppercase">Remove</button>
                </div>
            `).join('');

            renderPayPalButtons(total);
        }

        function renderPayPalButtons(total) {
            const container = document.getElementById('paypal-button-container');
            container.innerHTML = "";
            paypal.Buttons({
                style: { layout: 'vertical', color: 'black', shape: 'rect' },
                createOrder: (data, actions) => actions.order.create({ purchase_units: [{ amount: { value: total.toString() } }] }),
                onApprove: (data, actions) => actions.order.capture().then(details => {
                    alert('Thanks ' + details.payer.name.given_name + '!');
                    cart = []; updateCartUI();
                    document.getElementById('cart-sidebar').classList.remove('sidebar-open');
                })
            }).render('#paypal-button-container');
        }

        // Controles de los Sidebar
        document.getElementById('open-menu').onclick = () => document.getElementById('menu-sidebar').classList.add('sidebar-open');
        document.getElementById('close-menu').onclick = () => document.getElementById('menu-sidebar').classList.remove('sidebar-open');
        document.getElementById('open-cart').onclick = () => document.getElementById('cart-sidebar').classList.add('sidebar-open');
        document.getElementById('close-cart').onclick = () => document.getElementById('cart-sidebar').classList.remove('sidebar-open');

        loadStore();
    </script>
</body>
</html>
