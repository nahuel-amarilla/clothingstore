<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS CLOTHING | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .cart-sidebar { transition: transform 0.3s ease-in-out; transform: translateX(100%); }
        .cart-sidebar.open { transform: translateX(0); }
    </style>
</head>
<body class="bg-white">

    <nav class="p-6 flex justify-between items-center border-b sticky top-0 bg-white/90 backdrop-blur-md z-50">
        <h1 class="text-2xl font-black tracking-tighter italic">NCS CLOTHING</h1>
        <div id="open-cart" class="cursor-pointer bg-black text-white px-6 py-2 rounded-full text-xs font-bold hover:scale-105 transition">
            CART (<span id="cart-count">0</span>)
        </div>
    </nav>

    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-96 bg-white shadow-2xl z-[100] cart-sidebar p-8 flex flex-col">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black italic">YOUR CART</h2>
            <button id="close-cart" class="text-xl font-bold">✕</button>
        </div>
        
        <div id="cart-items" class="flex-grow overflow-y-auto space-y-4">
            </div>

        <div class="border-t pt-6 mt-6">
            <div class="flex justify-between text-xl font-black mb-6">
                <span>TOTAL</span>
                <span id="cart-total">$0</span>
            </div>
            <button onclick="processPayment()" class="w-full bg-black text-white py-4 rounded-xl font-bold hover:bg-gray-800 transition uppercase tracking-widest">
                Checkout (Card/Debit)
            </button>
        </div>
    </div>

    <header class="text-center py-12">
        <h2 class="text-7xl md:text-9xl font-black italic tracking-tighter">NCS</h2>
        <p class="text-gray-400 uppercase tracking-[0.4em] text-[10px] mt-2">Premium Safety & Streetwear</p>
    </header>

    <main class="max-w-7xl mx-auto p-6 mb-20">
        <div id="shop-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-10"></div>
    </main>

    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>

<div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full md:w-96 bg-white shadow-2xl z-[100] cart-sidebar p-8 flex flex-col translate-x-full transition-transform duration-300">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-black italic">YOUR CART</h2>
            <button id="close-cart" class="text-xl font-bold">✕</button>
        </div>
        
        <div id="cart-items" class="flex-grow overflow-y-auto space-y-4"></div>

        <div class="border-t pt-6 mt-6">
            <div class="flex justify-between text-xl font-black mb-6">
                <span>TOTAL</span>
                <span id="cart-total">$0</span>
            </div>
            
            <div id="paypal-button-container"></div>
        </div>
    </div>

<script>
    // ... (Tu configuración de Supabase y loadStore igual que antes) ...

    let cart = [];

    function updateCartUI() {
        const container = document.getElementById('cart-items');
        const totalElement = document.getElementById('cart-total');
        const count = document.getElementById('cart-count');
        
        count.innerText = cart.length;
        const total = cart.reduce((acc, item) => acc + item.price, 0);
        totalElement.innerText = `$${total}`;

        container.innerHTML = cart.map(item => `
            <div class="flex justify-between items-center border-b pb-4">
                <div>
                    <p class="font-bold text-sm uppercase">${item.name}</p>
                    <p class="text-gray-500 text-xs">$${item.price}</p>
                </div>
                <button onclick="removeFromCart(${item.cartId})" class="text-red-500 text-[10px] font-bold">REMOVE</button>
            </div>
        `).join('');

        // RENDERIZAR BOTONES DE PAYPAL SOLO SI HAY ITEMS
        renderPayPalButtons(total);
    }

    function renderPayPalButtons(totalAmount) {
        // Limpiamos el contenedor para que no se dupliquen los botones
        document.getElementById('paypal-button-container').innerHTML = "";
        
        if (totalAmount <= 0) return;

        paypal.Buttons({
            createOrder: (data, actions) => {
                return actions.order.create({
                    purchase_units: [{
                        amount: {
                            value: totalAmount.toString()
                        }
                    }]
                });
            },
            onApprove: (data, actions) => {
                return actions.order.capture().then(details => {
                    alert('Transaction completed by ' + details.payer.name.given_name);
                    cart = []; // Limpiar carrito tras el pago
                    updateCartUI();
                    document.getElementById('cart-sidebar').classList.remove('open');
                });
            }
        }).render('#paypal-button-container');
    }

    // Funciones de control de sidebar
    document.getElementById('open-cart').onclick = () => document.getElementById('cart-sidebar').classList.add('open');
    document.getElementById('close-cart').onclick = () => document.getElementById('cart-sidebar').classList.remove('open');

    // ... (El resto de tus funciones loadStore, addToCart, etc) ...
</script>
</body>
</html>
