<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS CLOTHING | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.paypal.com/sdk/js?client-id=test&currency=USD"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .sidebar { transition: transform 0.3s ease; z-index: 100; }
        .sidebar-open { transform: translateX(0) !important; }
        .admin-controls { display: none; } /* Solo para el jefe */
    </style>
</head>
<body class="bg-white text-black">

    <nav class="p-4 md:p-6 grid grid-cols-3 items-center border-b sticky top-0 bg-white/90 backdrop-blur-md z-[60]">
        <div class="flex gap-4 items-center">
            <button id="open-menu" class="text-xl font-bold">☰</button>
            <button id="auth-btn" class="hidden md:block text-[9px] font-black uppercase tracking-widest border border-black px-3 py-1 rounded-full hover:bg-black hover:text-white transition">Sign In</button>
        </div>
        
        <h1 class="text-lg md:text-2xl font-black tracking-tighter italic text-center uppercase">NCS CLOTHING</h1>
        
        <div class="flex items-center justify-end gap-3">
            <div id="open-cart" class="cursor-pointer bg-black text-white px-4 py-2 rounded-full text-[9px] font-bold uppercase tracking-widest">
                Cart (<span id="cart-count">0</span>)
            </div>
        </div>
    </nav>

    <div id="auth-sidebar" class="fixed top-0 left-0 h-full w-full md:w-80 bg-white shadow-2xl -translate-x-full sidebar p-8 flex flex-col border-r z-[110]">
        <div class="flex justify-between items-center mb-10">
            <h2 id="auth-title" class="text-2xl font-black italic uppercase">Account</h2>
            <button id="close-auth" class="text-xl font-bold text-gray-400">✕</button>
        </div>
        
        <div id="auth-form" class="space-y-4">
            <input type="email" id="user-email" placeholder="EMAIL" class="w-full p-4 border rounded-xl text-xs font-bold outline-none bg-gray-50">
            <input type="password" id="user-pass" placeholder="PASSWORD" class="w-full p-4 border rounded-xl text-xs font-bold outline-none bg-gray-50">
            <button onclick="handleAuth('login')" class="w-full bg-black text-white py-4 rounded-xl font-black text-[10px] uppercase">Login</button>
            <button onclick="handleAuth('signup')" class="w-full border border-gray-200 py-4 rounded-xl font-black text-[10px] uppercase text-gray-400 hover:text-black hover:border-black">Create Account</button>
        </div>

        <div id="user-info" class="hidden text-center">
            <p class="text-[10px] font-bold text-gray-400 mb-4">LOGGED IN AS:</p>
            <p id="logged-email" class="font-black text-sm mb-6"></p>
            <a href="admin.html" id="admin-link" class="hidden block w-full bg-blue-600 text-white py-4 rounded-xl font-black text-[10px] uppercase mb-3">Admin Panel</a>
            <button onclick="logout()" class="w-full bg-red-50 text-red-500 py-4 rounded-xl font-black text-[10px] uppercase">Logout</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto p-4 md:p-6 mt-6 mb-20">
        <div id="shop-container" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-10"></div>
    </main>

    <script>
        const _supabase = supabase.createClient('https://daoctgxvndqkjkethjcc.supabase.co', 'sb_publishable_G-9m4zalYE3mRzDpw2OiCQ_qFMxk9ec');

        // --- SISTEMA DE AUTENTICACIÓN ---
        async function handleAuth(type) {
            const email = document.getElementById('user-email').value;
            const password = document.getElementById('user-pass').value;

            if (type === 'signup') {
                const { error } = await _supabase.auth.signUp({ email, password });
                if (error) alert(error.message); else alert("Check your email or try logging in!");
            } else {
                const { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message); else window.location.reload();
            }
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.reload();
        }

        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            const authBtn = document.getElementById('auth-btn');
            
            if (user) {
                authBtn.innerText = "MY ACCOUNT";
                document.getElementById('auth-form').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('logged-email').innerText = user.email;

                // CAMBIA ESTO: Poné acá el mail que vas a usar vos para ser Admin
                if (user.email === "tu-mail-admin@gmail.com") {
                    document.getElementById('admin-link').classList.remove('hidden');
                    // Mostrar botones de borrar en la tienda
                    const deleteBtns = document.getElementsByClassName('admin-only');
                    for(let btn of deleteBtns) btn.style.display = 'block';
                }
            } else {
                authBtn.innerText = "SIGN IN";
            }
        }

        // --- LÓGICA DE TIENDA (Copia del código anterior) ---
        // (Asegurate de incluir aquí las funciones loadStore, renderProducts, addToCart, PayPal, etc.)
        // Nota: Agregué la clase 'admin-only' a los botones de borrar en renderProducts
    </script>
</body>
</html>
