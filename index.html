<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS CLOTHING | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-white">

    <nav class="p-6 flex justify-between items-center border-b sticky top-0 bg-white z-50">
        <h1 class="text-2xl font-black tracking-tighter italic">NCS CLOTHING</h1>
        <div id="cart-btn" class="cursor-pointer bg-black text-white px-4 py-2 rounded-full text-sm font-bold">
            CART (0)
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-8">
        <div id="shop-container" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <p class="col-span-full text-center text-gray-400">Loading collection...</p>
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient('https://daoctgxvndqkjkethjcc.supabase.co', 'sb_publishable_G-9m4zalYE3mRzDpw2OiCQ_qFMxk9ec');

        async function loadStore() {
            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            const container = document.getElementById('shop-container');
            
            if (error) {
                container.innerHTML = `<p class="text-red-500">Error loading store.</p>`;
                return;
            }

            if (products.length === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-full text-center">No products found. Go to Admin to upload some!</p>`;
                return;
            }

            container.innerHTML = products.map(p => `
                <div class="group border border-gray-100 rounded-2xl p-4 hover:shadow-xl transition-all duration-300">
                    <div class="aspect-square bg-gray-50 rounded-xl overflow-hidden mb-4">
                        <img src="${p.image_url}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                    </div>
                    <h3 class="font-bold text-lg uppercase tracking-tight">${p.name}</h3>
                    <p class="text-gray-400 text-sm mb-4">${p.category || 'Collection'}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xl font-black">$${p.price}</span>
                        <button class="bg-black text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-gray-800 transition">ADD TO CART</button>
                    </div>
                </div>
            `).join('');
        }

        loadStore();
    </script>
</body>
</html>
