<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCS CLOTHING | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="bg-gray-50">

    <nav class="p-4 md:p-6 flex justify-between items-center border-b sticky top-0 bg-white/80 backdrop-blur-md z-50">
        <h1 class="text-2xl font-black tracking-tighter italic">NCS CLOTHING</h1>
        <div id="cart-btn" class="cursor-pointer bg-black text-white px-5 py-2 rounded-full text-sm font-bold flex items-center gap-2 hover:bg-gray-800 transition">
            CART (<span id="cart-count">0</span>)
        </div>
    </nav>

    <header class="bg-black text-white py-16 px-8 text-center mb-8">
        <h2 class="text-5xl md:text-7xl font-black italic mb-4 tracking-tighter">NEW COLLECTION</h2>
        <p class="text-gray-400 uppercase tracking-widest text-sm">Indumentaria de seguridad y estilo urbano</p>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-8">
        <div id="shop-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <p class="col-span-full text-center text-gray-400 animate-pulse">Conectando con la colección...</p>
        </div>
    </main>

    <footer class="border-t py-12 mt-12 text-center text-gray-500 text-sm">
        <p>&copy; 2024 NCS CLOTHING. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Configuración de Supabase
        const _supabase = supabase.createClient('https://daoctgxvndqkjkethjcc.supabase.co', 'sb_publishable_G-9m4zalYE3mRzDpw2OiCQ_qFMxk9ec');

        let cart = [];

        // 1. Función para Cargar Productos
        async function loadStore() {
            const container = document.getElementById('shop-container');
            
            const { data: products, error } = await _supabase
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                container.innerHTML = `<p class="text-red-500 col-span-full text-center">Error al conectar con la base de datos.</p>`;
                return;
            }

            if (products.length === 0) {
                container.innerHTML = `<p class="text-gray-500 col-span-full text-center">No hay productos disponibles por ahora.</p>`;
                return;
            }

            // Renderizado de productos
            container.innerHTML = products.map(p => `
                <div class="product-card bg-white border border-gray-100 rounded-2xl p-4 shadow-sm hover:shadow-xl transition-all duration-300">
                    <div class="aspect-[3/4] bg-gray-100 rounded-xl overflow-hidden mb-4">
                        <img src="${p.image_url}" alt="${p.name}" class="w-full h-full object-cover">
                    </div>
                    <h3 class="font-bold text-lg uppercase tracking-tight mb-1">${p.name}</h3>
                    <p class="text-gray-400 text-xs mb-4">${p.category || 'ARTÍCULO ORIGINAL'}</p>
                    <div class="flex justify-between items-center">
                        <span class="text-2xl font-black text-black">$${p.price}</span>
                        <button onclick="addToCart('${p.id}', '${p.name}', ${p.price})" 
                                class="bg-black text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-gray-700 active:scale-95 transition">
                            ADD TO CART
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // 2. Lógica del Carrito
        function addToCart(id, name, price) {
            const product = { id, name, price };
            cart.push(product);
            
            // Actualizar el número en el botón del menú
            document.getElementById('cart-count').innerText = cart.length;
            
            // Efecto visual simple
            console.log("Producto agregado:", name);
        }

        // 3. Ver Carrito (Muestra una alerta por ahora)
        document.getElementById('cart-btn').addEventListener('click', () => {
            if(cart.length === 0) {
                alert("Tu carrito está vacío.");
            } else {
                const total = cart.reduce((sum, item) => sum + item.price, 0);
                const lista = cart.map(item => `- ${item.name}: $${item.price}`).join('\n');
                alert(`TU CARRITO:\n${lista}\n\nTOTAL: $${total}`);
            }
        });

        // Iniciar tienda
        loadStore();
    </script>
</body>
</html>
